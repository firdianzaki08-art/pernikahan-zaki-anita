<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kartu Tamu · Zaki &amp; Anita</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23d6243a%27 d=%27M12 21.4l-1.5-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.6L12 21.4z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Jost:wght@400;500;600&display=swap">
<style>
/* Halaman pembuat kartu tamu: ketik nama, kartu tergambar di canvas, lalu bagikan / unduh */
:root{--bg:#111;--panel:#1c1c1c;--teks:#f2f2f2;--redup:#9a9a9a;--emas:#f2c94c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);font-family:"Jost",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:"Archivo",Arial,sans-serif;font-size:20px;margin:4px 0 4px}
p.ket{color:var(--redup);font-size:14px;margin:0 0 16px;line-height:1.45}
label{display:block;font-size:13px;color:var(--redup);margin-bottom:6px}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid #333;background:var(--panel);color:var(--teks)}
select,textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #333;background:var(--panel);color:var(--teks);margin-bottom:12px}
textarea{line-height:1.45;resize:vertical}
.kecil{font-size:13px;margin:-6px 0 10px}
.foto-atur{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.foto-atur select{flex:1;margin:0}
.foto-atur button{padding:9px 14px;font-size:14px;white-space:nowrap}
.foto-atur .sebaris{margin:0;font-size:14px}
.foto-atur input[type=range]{flex:1;padding:0;border:0;background:none;accent-color:#25d366}
canvas{display:block;width:100%;height:auto;margin:16px 0;touch-action:none;cursor:grab;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.tombol{display:grid;gap:10px}
button{font:inherit;font-weight:600;font-size:16px;padding:13px;border-radius:999px;border:0;cursor:pointer}
.utama{background:#25d366;color:#06240f}
.kedua{background:#fff;color:#111}
.ketiga{background:transparent;color:var(--teks);border:1px solid #444}
#info{min-height:20px;font-size:13px;color:var(--redup);text-align:center;margin-top:10px}
.link{word-break:break-all;font-size:13px;color:var(--redup);margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Kartu Kabar Bahagia per Tamu</h1>
  <p class="ket">Ketik nama penerima, lalu bagikan kartunya ke WhatsApp bersama teks pemberitahuan dan link undangan digital. Nama penerima otomatis tertulis di halamannya.</p>
  <label for="nama">Nama tamu</label>
  <input id="nama" autocomplete="off" placeholder="contoh: Budi Santoso">
  <canvas id="kartu" width="1080" height="1080" aria-label="Pratinjau kartu undangan"></canvas>
  <p class="ket kecil">Geser foto di kartu untuk mengatur posisinya, dan pakai Zoom supaya tidak terpotong.</p>
  <div class="foto-atur">
    <select id="pilihFoto" aria-label="Pilih foto"></select>
    <button class="ketiga" id="unggah" type="button">Unggah foto</button>
    <input type="file" id="fileFoto" accept="image/*" hidden>
  </div>
  <div class="foto-atur">
    <label for="zoom" class="sebaris">Zoom</label>
    <input type="range" id="zoom" min="0" max="1" step="0.001">
    <button class="ketiga" id="resetFoto" type="button">Reset</button>
  </div>
  <label for="versi">Teks broadcast</label>
  <select id="versi"><option value="0">Versi 1 (formal)</option><option value="1">Versi 2 (hangat)</option></select>
  <textarea id="pesan" rows="9" aria-label="Isi pesan broadcast"></textarea>
  <div class="tombol">
    <button class="utama" id="bagikan" type="button">Bagikan ke WhatsApp</button>
    <button class="kedua" id="unduh" type="button">Unduh gambar</button>
    <button class="ketiga" id="salin" type="button">Salin pesan</button>
  </div>
  <div class="link" id="link"></div>
  <div id="info"></div>
</main>

<script>
/* Data acara diambil dari undangan (index.html) supaya ikut berubah bila isinya diedit; ini cadangannya */
let D={pw:"ZAKI & ANITA",tanggal:"Sabtu, 27 Maret 2027",jam:"08.00 - 11.00 WIB",tempat:"Masjid Al Azhom",alamat:"Jl. Satria Sudirman, Kota Tangerang, Banten"};
const BASE=new URL("./",location.href).href;
const $=id=>document.getElementById(id);
const muat=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
let FOTO=null, LOGO=null, PILIHAN=[];
const NAMA_FOTO={"latar.sampul":"Foto sampul","latar.lokasi":"Foto lokasi","latar.rsvp":"Foto RSVP","foto.getting":"Foto getting married","foto.kutip":"Foto kutipan","foto.strip1":"Foto strip 1","foto.strip2":"Foto strip 2","foto.strip3":"Foto strip 3","foto.film1":"Foto film 1","foto.film2":"Foto film 2","foto.sampul":"Foto kartu sampul"};
/* posisi foto kartu disimpan di HP ini: {src, z (0 = muat utuh, 1 = zoom 3x dari penuh), ox, oy} */
const SIMPAN="kartuFoto-v1", SIMPAN_UNGGAH="kartuFotoUnggah-v1";
const AWAL={src:"latar.sampul",z:null,ox:.5,oy:.15};
let P={...AWAL};
try{ Object.assign(P,JSON.parse(localStorage.getItem(SIMPAN)||"{}")); }catch(e){}
const simpanP=()=>{ try{ localStorage.setItem(SIMPAN,JSON.stringify(P)); }catch(e){} };

async function siapkan(){
  try{
    const s=await (await fetch(BASE+"index.html",{cache:"no-cache"})).text();
    const m=s.match(/<script type="application\/json" id="isi">([\s\S]*?)<\/script>/);
    if(m){ const d=JSON.parse(m[1]);
      D={pw:`${d.pria.panggilan} & ${d.wanita.panggilan}`.toUpperCase(),tanggal:d.tanggalPanjang||D.tanggal,jam:d.akad||D.jam,tempat:d.tempat||D.tempat,alamat:d.alamat||D.alamat};
      for(const g of ["latar","foto"]) for(const [k,v] of Object.entries(d[g]||{})) if(typeof v==="string"&&v.startsWith("data:")&&NAMA_FOTO[g+"."+k]) PILIHAN.push({id:g+"."+k,nama:NAMA_FOTO[g+"."+k],src:v});
    }
  }catch(e){}
  try{ const u=localStorage.getItem(SIMPAN_UNGGAH); if(u) PILIHAN.push({id:"unggah",nama:"Foto unggahan",src:u}); }catch(e){}
  if(!PILIHAN.length) PILIHAN.push({id:"og",nama:"Foto sampul",src:BASE+"og.jpg"});
  $("pilihFoto").innerHTML=PILIHAN.map(x=>`<option value="${x.id}">${x.nama}</option>`).join("");
  if(!PILIHAN.some(x=>x.id===P.src)) P={...AWAL,src:PILIHAN[0].id};
  if(!PILIHAN.some(x=>x.id===P.src)) P.src=PILIHAN[0].id;
  $("pilihFoto").value=P.src;
  FOTO=await muat(PILIHAN.find(x=>x.id===P.src).src);
  LOGO=await muat(BASE+"assets/hipo-plus.png");
  try{ await Promise.all(["800 50px Archivo, Arial, sans-serif","700 30px Archivo, Arial, sans-serif","500 26px Jost, Arial, sans-serif","400 26px Jost, Arial, sans-serif"].map(f=>document.fonts.load(f))); }catch(e){}
}

/* nama tamu -> bagian link (#Budi-Santoso), sama aturannya dengan undangan */
function slug(n){ return n.normalize("NFKC").replace(/[^\p{L}\p{N}\s-]/gu,"").trim().replace(/\s+/g,"-"); }
function linkTamu(n){ const s=slug(n); return s? BASE+"#"+s : BASE; }

function bungkus(ctx,teks,lebar){
  const kata=teks.split(/\s+/), baris=[]; let b="";
  for(const k of kata){ const c=b?b+" "+k:k; if(ctx.measureText(c).width>lebar&&b){ baris.push(b); b=k; } else b=c; }
  if(b) baris.push(b); return baris;
}
function tutupi(ctx,img,x,y,w,h,fy=.3){ // object-fit:cover, fokus vertikal fy
  const s=Math.max(w/img.width,h/img.height), sw=w/s, sh=h/s;
  ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)*fy,sw,sh,x,y,w,h);
}
/* skala foto: z=0 seluruh foto terlihat (bisa ada sisi kosong), z≈0.33 penuh menutup bingkai, z=1 zoom 3x */
function skala(img,w,h,z){ const muatS=Math.min(w/img.width,h/img.height), tutupS=Math.max(w/img.width,h/img.height); return muatS*Math.pow(tutupS*3/muatS,z); }
function zPenuh(img,w,h){ const a=Math.min(w/img.width,h/img.height), b=Math.max(w/img.width,h/img.height); return Math.log(b/a)/Math.log(b*3/a); }
function gambarFoto(ctx,img,x,y,w,h){
  if(P.z==null) P.z=zPenuh(img,w,h);
  const s=skala(img,w,h,P.z), dw=img.width*s, dh=img.height*s;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  if(dw<w-1||dh<h-1){ // sisi kosong diisi versi foto yang buram & gelap
    const t=Math.max(w/img.width,h/img.height); ctx.filter="blur(24px) brightness(.45)";
    ctx.drawImage(img,x+(w-img.width*t)/2,y+(h-img.height*t)/2,img.width*t,img.height*t); ctx.filter="none";
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(x,y,w,h);
  }
  ctx.drawImage(img,x+(w-dw)*P.ox,y+(h-dh)*P.oy,dw,dh); ctx.restore();
  return {dw,dh};
}
/* foto kartu selalu hitam-putih, lewat piksel supaya jalan juga di browser tanpa ctx.filter (Safari lama) */
function hitamPutih(ctx,x,y,w,h){
  const im=ctx.getImageData(x,y,w,h), d=im.data;
  for(let i=0;i<d.length;i+=4){ const g=d[i]*.299+d[i+1]*.587+d[i+2]*.114; d[i]=d[i+1]=d[i+2]=g; }
  ctx.putImageData(im,x,y);
}
function logoPutih(ctx,x,y,h){
  if(!LOGO) return 0;
  const w=LOGO.width*h/LOGO.height, c=document.createElement("canvas"); c.width=Math.ceil(w); c.height=Math.ceil(h);
  const g=c.getContext("2d"); g.drawImage(LOGO,0,0,w,h); g.globalCompositeOperation="source-in"; g.fillStyle="#fff"; g.fillRect(0,0,w,h);
  ctx.drawImage(c,x,y); return w;
}
function kredit(ctx,cx,y,h){
  ctx.font="400 22px Jost, Arial, sans-serif"; ctx.fillStyle="#dcdcdc"; ctx.textBaseline="middle";
  const t="Made by", tw=ctx.measureText(t).width, lw=LOGO?LOGO.width*h/LOGO.height:0, gap=14, x=cx-(tw+gap+lw)/2;
  ctx.textAlign="left"; ctx.fillText(t,x,y); logoPutih(ctx,x+tw+gap,y-h*.62,h); ctx.textBaseline="alphabetic";
}

/* kartu kotak 1080x1080 untuk dikirim sebagai gambar */
const KW=1080, KH=1080, FH=600;
function teksMuat(ctx,teks,font,maks,lebar){ let u=maks; do{ ctx.font=font.replace("{}",u); u-=2; }while(ctx.measureText(teks).width>lebar&&u>20); }
function gambarKartu(nama){
  const cv=$("kartu"), ctx=cv.getContext("2d"), W=KW, H=KH, X=64;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  if(FOTO){ gambarFoto(ctx,FOTO,0,0,W,FH); hitamPutih(ctx,0,0,W,FH); }
  const g=ctx.createLinearGradient(0,FH*.5,0,FH); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,.85)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,FH);
  ctx.textAlign="left"; ctx.fillStyle="#fff";
  ctx.font="400 30px Jost, Arial, sans-serif"; ctx.fillText("Wedding Announcement",X,FH-100);
  ctx.font="800 66px Archivo, Arial, sans-serif"; ctx.fillText(D.pw,X,FH-32);

  ctx.font="400 28px Jost, Arial, sans-serif"; ctx.fillStyle="#cfcfcf"; ctx.fillText("Dear",X,FH+70);
  ctx.fillStyle="#fff"; teksMuat(ctx,nama||"Tamu Undangan","700 {}px Archivo, Arial, sans-serif",44,W-2*X); ctx.fillText(nama||"Tamu Undangan",X,FH+124);
  ctx.fillStyle="#333"; ctx.fillRect(X,FH+162,W-2*X,2);

  const Y=FH+222, X2=W/2+20, L2=W-X2-X;
  ctx.font="700 28px Archivo, Arial, sans-serif"; ctx.fillStyle="#f2c94c"; ctx.fillText("Akad Nikah",X,Y); ctx.fillText("Lokasi",X2,Y);
  ctx.fillStyle="#fff"; teksMuat(ctx,D.tanggal,"600 {}px Jost, Arial, sans-serif",30,X2-X-30); ctx.fillText(D.tanggal,X,Y+48);
  ctx.font="400 28px Jost, Arial, sans-serif"; ctx.fillStyle="#e6e6e6"; ctx.fillText(D.jam,X,Y+88);
  ctx.fillStyle="#fff"; teksMuat(ctx,D.tempat,"600 {}px Jost, Arial, sans-serif",30,L2); ctx.fillText(D.tempat,X2,Y+48);
  ctx.font="400 26px Jost, Arial, sans-serif"; ctx.fillStyle="#e6e6e6";
  bungkus(ctx,D.alamat,L2).slice(0,2).forEach((b,i)=>ctx.fillText(b,X2,Y+88+i*36));
  kredit(ctx,W/2,H-52,44);
}

/* gambar pratinjau link (og.jpg) 1200x630, dibuat sekali dengan ?og */
function gambarOG(){
  const cv=$("kartu"); cv.width=1200; cv.height=630; const ctx=cv.getContext("2d");
  ctx.fillStyle="#000"; ctx.fillRect(0,0,1200,630);
  if(FOTO){ tutupi(ctx,FOTO,0,0,520,630,.1); }
  const g=ctx.createLinearGradient(380,0,520,0); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"#000"); ctx.fillStyle=g; ctx.fillRect(380,0,141,630);
  const X=580; ctx.textAlign="left"; ctx.fillStyle="#fff";
  ctx.font="400 32px Jost, Arial, sans-serif"; ctx.fillText("The Wedding Of",X,190);
  ctx.font="800 66px Archivo, Arial, sans-serif"; ctx.fillText(D.pw,X,270);
  ctx.font="700 28px Archivo, Arial, sans-serif"; ctx.fillStyle="#f2c94c"; ctx.fillText("Akad Nikah",X,350);
  ctx.font="600 30px Jost, Arial, sans-serif"; ctx.fillStyle="#fff"; ctx.fillText(D.tanggal,X,396);
  ctx.font="400 28px Jost, Arial, sans-serif"; ctx.fillStyle="#e6e6e6"; ctx.fillText(D.tempat+", "+D.alamat.split(",").slice(-2,-1).join("").trim(),X,438);
  kredit(ctx,X+230,560,40);
}

const blob=()=>new Promise(r=>$("kartu").toBlob(r,"image/jpeg",.92));
const namaFile=()=>"undangan-"+(slug($("nama").value)||"tamu").toLowerCase()+".jpg";
const TEKS=[
`Yth.
Bapak/Ibu/Saudara/i
*{NAMA}*
di Tempat

Bismillahirrahmanirrahim

Dengan penuh rasa syukur kepada Allah SWT, kami bermaksud menyampaikan kabar bahagia atas pernikahan kami:

*FIRDIAN ZAKI PUTRA WIBOWO & ANITA NURUL SYAHRUDIN*

yang Insya Allah akan dilangsungkan pada {TANGGAL}.

Dikarenakan acara pernikahan kami dilaksanakan secara terbatas (intimate wedding), dengan segala kerendahan hati kami mohon maaf tidak dapat mengundang Bapak/Ibu/Saudara/i untuk hadir secara langsung.

Tanpa mengurangi rasa hormat, kami memohon doa restu agar pernikahan kami senantiasa diberkahi Allah SWT. Kabar lengkap dan ucapan dapat disampaikan melalui link berikut:
{LINK}

Kami yang berbahagia,
*ZAKI & ANITA*

Mohon maaf apabila ada salah dalam penulisan nama.`,
`Assalamu'alaikum Warahmatullahi Wabarakatuh

Kepada Yth.
*{NAMA}*

Alhamdulillah, dengan memohon rahmat dan ridha Allah SWT, kami ingin berbagi kabar bahagia. Insya Allah kami akan melangsungkan akad nikah pada:

🗓 {TANGGAL}
📍 {TEMPAT}

Pernikahan kami digelar secara sederhana bersama keluarga inti (intimate wedding), sehingga kami mohon maaf belum dapat mengundang Bapak/Ibu/Saudara/i secara langsung 🙏

Doa dan restu dari Bapak/Ibu/Saudara/i sangat berarti bagi kami. Cerita kami dan kolom ucapan bisa dibuka di sini:

👉 {LINK}

Wassalamu'alaikum Warahmatullahi Wabarakatuh

Kami yang berbahagia,
*Zaki & Anita*
beserta keluarga`];
const pesan=n=>TEKS[+$("versi").value].replace(/\{NAMA\}/g,n||"Bapak/Ibu/Saudara/i").replace(/\{LINK\}/g,linkTamu(n)).replace(/\{TANGGAL\}/g,D.tanggal).replace(/\{JAM\}/g,D.jam).replace(/\{TEMPAT\}/g,D.tempat+", "+(D.alamat.split(",").slice(-2,-1)[0]||"").trim());
function info(t){ $("info").textContent=t; }
let FILE=null, jedaFile;
function perbarui(){ const n=$("nama").value.trim(); gambarKartu(n); FILE=null; clearTimeout(jedaFile); jedaFile=setTimeout(async()=>{ FILE=new File([await blob()],namaFile(),{type:"image/jpeg"}); },250); $("link").textContent=linkTamu(n); $("pesan").value=pesan(n); }
$("versi").addEventListener("change",perbarui);

$("nama").addEventListener("input",perbarui);

/* ---- atur foto: geser di kartu, zoom, ganti, unggah ---- */
function aturZoom(){ $("zoom").value=P.z; }
$("zoom").addEventListener("input",e=>{ P.z=+e.target.value; gambarKartu($("nama").value.trim()); });
$("zoom").addEventListener("change",()=>{ simpanP(); perbarui(); });
$("resetFoto").onclick=()=>{ P={...AWAL,src:P.src}; P.z=null; perbarui(); aturZoom(); simpanP(); };
$("pilihFoto").onchange=async e=>{ const x=PILIHAN.find(v=>v.id===e.target.value); FOTO=await muat(x.src); P={...AWAL,src:x.id}; perbarui(); aturZoom(); simpanP(); };
$("unggah").onclick=()=>$("fileFoto").click();
$("fileFoto").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=await muat(URL.createObjectURL(f)); if(!img){ info("Foto tidak bisa dibuka."); return; }
  const m=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas");
  c.width=Math.round(img.width*m); c.height=Math.round(img.height*m); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const src=c.toDataURL("image/jpeg",.88);
  try{ localStorage.setItem(SIMPAN_UNGGAH,src); }catch(e){}
  PILIHAN=PILIHAN.filter(v=>v.id!=="unggah"); PILIHAN.push({id:"unggah",nama:"Foto unggahan",src});
  $("pilihFoto").innerHTML=PILIHAN.map(x=>`<option value="${x.id}">${x.nama}</option>`).join(""); $("pilihFoto").value="unggah";
  FOTO=await muat(src); P={...AWAL,src:"unggah"}; perbarui(); aturZoom(); simpanP(); e.target.value="";
};
(()=>{ const cv=$("kartu"); let tarik=null;
  const titik=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}; };
  cv.addEventListener("pointerdown",e=>{ if(!FOTO) return; const t=titik(e); if(t.y>FH) return; tarik=t; cv.setPointerCapture(e.pointerId); cv.style.cursor="grabbing"; });
  cv.addEventListener("pointermove",e=>{ if(!tarik) return; const t=titik(e), s=skala(FOTO,KW,FH,P.z), dw=FOTO.width*s, dh=FOTO.height*s;
    if(Math.abs(KW-dw)>1) P.ox=Math.min(1,Math.max(0,P.ox+(t.x-tarik.x)/(KW-dw)));
    if(Math.abs(FH-dh)>1) P.oy=Math.min(1,Math.max(0,P.oy+(t.y-tarik.y)/(FH-dh)));
    tarik=t; gambarKartu($("nama").value.trim()); });
  const lepas=()=>{ if(!tarik) return; tarik=null; cv.style.cursor=""; simpanP(); perbarui(); };
  cv.addEventListener("pointerup",lepas); cv.addEventListener("pointercancel",lepas);
})();
$("unduh").onclick=async()=>{ const b=await blob(), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=namaFile(); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); info("Gambar tersimpan. Kirim gambar ini lewat WhatsApp bersama link tamu."); };
$("salin").onclick=async()=>{ try{ await navigator.clipboard.writeText($("pesan").value); info("Pesan broadcast dan link tamu tersalin."); }catch(e){ info("Gagal menyalin, salin link di atas secara manual."); } };
$("bagikan").onclick=async()=>{
  // Teks broadcast dikirim sebagai keterangan gambar. Sebagian WhatsApp (terutama iPhone) membuang teks bila ada gambar,
  // jadi teks juga disalin ke clipboard sebagai cadangan. Clipboard & share dipanggil langsung tanpa jeda agar diizinkan browser.
  const teks=$("pesan").value;
  if(!FILE) FILE=new File([await blob()],namaFile(),{type:"image/jpeg"});
  try{ navigator.clipboard.writeText(teks).catch(()=>{}); }catch(e){}
  const data={files:[FILE],text:teks};
  if(navigator.canShare&&navigator.canShare(data)){
    try{ await navigator.share(data); info("Terkirim. Kalau teksnya tidak muncul di bawah gambar, tekan lama kolom keterangan di WhatsApp lalu pilih Tempel (teks sudah tersalin)."); }
    catch(e){ if(e.name!=="AbortError") info("Gagal membagikan, coba Unduh gambar lalu Salin pesan."); }
  }else{
    $("unduh").onclick(); open("https://wa.me/?text="+encodeURIComponent(teks),"_blank");
    info("Teks broadcast sudah masuk di WhatsApp yang terbuka. Lampirkan gambar kartu yang barusan terunduh.");
  }
};
