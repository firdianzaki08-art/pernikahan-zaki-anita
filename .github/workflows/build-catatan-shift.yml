name: Build Catatan Shift APK

on:
  push:
    paths:
      - 'catatan-shift-android/**'
      - '.github/workflows/build-catatan-shift.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catatan-shift-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle web page into the app
        run: ./web/build-asset.sh

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CatatanShift.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CatatanShift-apk
          path: catatan-shift-android/CatatanShift.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catatan-shift-latest
          name: Catatan Shift (APK terbaru)
          body: Unduh CatatanShift.apk di bawah, lalu buka file itu di HP Android untuk memasang.
          prerelease: true
          files: catatan-shift-android/CatatanShift.apk
